# Builds each pull request and deploys it to
# https://<owner>.github.io/camera-menu/pr-preview/pr-<number>/
# The preview is removed when the pull request is closed.
name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# Serialize writes to the gh-pages branch with the production workflow
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token and cannot push to gh-pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'yarn'
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: yarn install --frozen-lockfile
      - name: Build
        if: github.event.action != 'closed'
        # Serve assets from the preview subdirectory instead of the site root
        run: yarn build --base=/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
